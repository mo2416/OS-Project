<svg xmlns="http://www.w3.org/2000/svg" width="1062.5" height="633.5" viewBox="31.0 1.0 1062.5 633.5"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#595959"/></marker></defs><rect x="31" y="1" width="1062.5" height="633.5" fill="#ffffff"/><rect x="40" y="10" width="500" height="76" rx="10" fill="#E2EFDA" stroke="#548235" stroke-width="2"/><text x="290" y="36.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">BPF timer tick every 20 ms:</text><text x="290" y="59.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">demand EWMA (1/8) · decayed late fraction</text><path d="M290,86 L290,98" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><polygon points="290,98 500,150 290,202 80,150" fill="#FFF2CC" stroke="#BF8F00" stroke-width="2.5"/><text x="290" y="138.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">demand &gt; 80 % of</text><text x="290" y="161.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">active capacity?</text><path d="M500,150 L588,150" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><text x="548" y="136" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-style="italic">yes</text><rect x="590" y="114" width="250" height="72" rx="10" fill="#DCE6F2" stroke="#1F3864" stroke-width="2"/><text x="715" y="138.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">grow to smallest set</text><text x="715" y="161.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">with demand ≤ 80 %</text><path d="M840,150 L877,150" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><path d="M290,202 L290,216" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><text x="312" y="210" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-style="italic">no</text><polygon points="290,218 500,270 290,322 80,270" fill="#FFF2CC" stroke="#BF8F00" stroke-width="2.5"/><text x="290" y="258.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">≥ nr_active tasks queued</text><text x="290" y="281.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">for 2 ticks?</text><path d="M500,270 L588,270" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><text x="548" y="256" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-style="italic">yes</text><rect x="590" y="234" width="250" height="72" rx="10" fill="#DCE6F2" stroke="#1F3864" stroke-width="2"/><text x="715" y="258.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">grow by</text><text x="715" y="281.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">1 + queued / 2</text><path d="M840,270 L877,270" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><path d="M290,322 L290,336" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><text x="312" y="330" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-style="italic">no</text><polygon points="290,338 500,390 290,442 80,390" fill="#FFF2CC" stroke="#BF8F00" stroke-width="2.5"/><text x="290" y="378.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">guard on, late &gt; P ‰</text><text x="290" y="401.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">and no cooldown?</text><path d="M500,390 L588,390" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><text x="548" y="376" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-style="italic">yes</text><rect x="590" y="354" width="250" height="72" rx="10" fill="#FBE5D6" stroke="#C55A11" stroke-width="2"/><text x="715" y="378.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">grow by 1;</text><text x="715" y="401.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">cooldown 8 ticks</text><path d="M840,390 L877,390" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><path d="M290,442 L290,456" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><text x="312" y="450" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-style="italic">no</text><polygon points="290,458 500,510 290,562 80,510" fill="#FFF2CC" stroke="#BF8F00" stroke-width="2.5"/><text x="290" y="498.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">fits n−1 CPUs at ≤ 50 %,</text><text x="290" y="521.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">queue empty, late ≤ P/2 ‰?</text><path d="M500,510 L588,510" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><text x="548" y="496" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-style="italic">yes</text><rect x="590" y="474" width="250" height="72" rx="10" fill="#EDEDED" stroke="#7F7F7F" stroke-width="2"/><text x="715" y="498.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">after 5 such ticks:</text><text x="715" y="521.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">shrink by 1</text><path d="M840,510 L877,510" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><path d="M290,562 L290,576" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><text x="312" y="570" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-style="italic">no</text><rect x="160" y="578" width="260" height="48" rx="10" fill="#EDEDED" stroke="#7F7F7F" stroke-width="2"/><text x="290" y="602" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">keep size</text><path d="M420,602 L877,602" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><line x1="880" y1="150" x2="880" y2="602" stroke="#595959" stroke-width="2"/><rect x="905" y="320" width="180" height="110" rx="10" fill="#E2EFDA" stroke="#548235" stroke-width="2"/><text x="995" y="352.5" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">apply size;</text><text x="995" y="375" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">kick new CPUs;</text><text x="995" y="397.5" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">re-arm timer</text><path d="M880,375 L902,375" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/></svg>