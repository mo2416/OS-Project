<svg xmlns="http://www.w3.org/2000/svg" width="891.0" height="699.5" viewBox="47.5 1.0 891.0 699.5"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#595959"/></marker></defs><rect x="47.5" y="1" width="891" height="699.5" fill="#ffffff"/><rect x="90" y="10" width="280" height="46" rx="10" fill="#E2EFDA" stroke="#548235" stroke-width="2"/><text x="230" y="33" font-family="Liberation Sans" font-size="19" font-weight="bold" fill="#000" text-anchor="middle" dominant-baseline="middle">Task becomes runnable</text><path d="M230,56 L230,73" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><polygon points="230,73 400,125 230,177 60,125" fill="#FFF2CC" stroke="#BF8F00" stroke-width="2.5"/><text x="230" y="113.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">select_cpu: previous CPU</text><text x="230" y="136.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">active and idle?</text><path d="M400,125 L578,125" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><text x="470" y="111" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-style="italic">yes</text><rect x="580" y="89" width="320" height="72" rx="10" fill="#DCE6F2" stroke="#1F3864" stroke-width="2"/><text x="740" y="113.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">dispatch to that</text><text x="740" y="136.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">CPU’s local queue</text><path d="M230,177 L230,201" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><text x="252" y="189" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-style="italic">no</text><polygon points="230,203 400,255 230,307 60,255" fill="#FFF2CC" stroke="#BF8F00" stroke-width="2.5"/><text x="230" y="243.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">an idle CPU inside</text><text x="230" y="266.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">the active set?</text><path d="M400,255 L578,255" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><text x="470" y="241" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-style="italic">yes</text><rect x="580" y="219" width="320" height="72" rx="10" fill="#DCE6F2" stroke="#1F3864" stroke-width="2"/><text x="740" y="243.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">dispatch to that</text><text x="740" y="266.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">CPU’s local queue</text><path d="M230,307 L230,331" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><text x="252" y="319" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-style="italic">no</text><polygon points="230,333 400,385 230,437 60,385" fill="#FFF2CC" stroke="#BF8F00" stroke-width="2.5"/><text x="230" y="373.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">affinity excludes</text><text x="230" y="396.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">every active CPU?</text><path d="M400,385 L578,385" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><text x="470" y="371" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-style="italic">yes</text><rect x="580" y="349" width="320" height="72" rx="10" fill="#DCE6F2" stroke="#1F3864" stroke-width="2"/><text x="740" y="373.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">LOCAL_ON an allowed</text><text x="740" y="396.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">CPU + kick</text><path d="M230,437 L230,461" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><text x="252" y="449" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-style="italic">no</text><rect x="70" y="461" width="320" height="92" rx="10" fill="#FBE5D6" stroke="#C55A11" stroke-width="2"/><text x="230" y="485.75" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">insert into shared vtime queue</text><text x="230" y="507" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">(guard: stamp wait start)</text><text x="230" y="528.25" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">kick an idle active CPU</text><path d="M230,553 L230,578" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><rect x="70" y="580" width="320" height="70" rx="10" fill="#DCE6F2" stroke="#1F3864" stroke-width="2"/><text x="230" y="604.375" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">dispatch: only ACTIVE CPUs</text><text x="230" y="625.625" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">pull from the shared queue</text><rect x="580" y="480" width="320" height="170" rx="10" fill="#F2F6FB" stroke="#2E74B5" stroke-width="2"/><text x="740" y="531.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">ops.running on that CPU:</text><text x="740" y="553.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">busy-time start;</text><text x="740" y="576.25" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">guard sample — "late" if</text><text x="740" y="598.75" font-family="Liberation Sans" font-size="18" font-weight="normal" fill="#000" text-anchor="middle" dominant-baseline="middle">queued longer than L µs</text><path d="M390,615 L577,615" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#ah)"/><path d="M900,125 L930,125 M900,255 L930,255 M900,385 L930,385 M930,125 L930,540" fill="none" stroke="#595959" stroke-width="2" stroke-dasharray="7 5"/><path d="M930,540 L903,540" fill="none" stroke="#595959" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ah)"/><text x="500" y="685" font-family="Liberation Sans" font-size="17" font-weight="normal" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-style="italic">CPUs outside the active set never pull shared work, so they stay idle.</text></svg>